# abicheck configuration, picked up from the repo root by `abicheck compare`.

# frontend: clang because castxml's cc-gnu detection parses SVS's C++20 headers at
# the wrong standard. Layout-only checks fall back to the .so's DWARF.
#
# The options reproduce build assumptions the headers make but do not state. One
# fixed set applied to BOTH sides on purpose: abicheck fingerprints compiler +
# macros + includes and refuses to compare (rc=16) if the two sides disagree.
#
#   -fsized-deallocation   svs::lib::Allocator calls the sized+aligned
#                          `::operator delete`, which clang leaves off by default.
#   -DSPDLOG_FMT_EXTERNAL  the shipped spdlog has no fmt/bundled/.
#   -DSVS_*                svs/lib/preprocessor.h static_asserts each is 0 or 1.
#   -DSVS_VERSION_*        svs/lib/version.h needs them defined; 0/0/0 because they
#                          are constructor arguments, not types, so they cannot
#                          move the ABI and must match on both sides anyway.
compile:
  frontend: clang
  std: c++20
  options: [-include, cstddef, -fsized-deallocation, -DSPDLOG_FMT_EXTERNAL,
            -DSVS_CHECK_BOUNDS=0, -DSVS_ENABLE_NUMA=0, -DSVS_INITIALIZE_LOGGER=1,
            -DSVS_VERSION_MAJOR=0, -DSVS_VERSION_MINOR=0, -DSVS_VERSION_PATCH=0]

# Scope the compared surface to what we publish, and collapse the std/gnu_cxx
# template-instantiation noise that leaks past --exclude-libs,ALL.
scope:
  public: true
  collapse_versioned_symbols: true

suppression:
  require_justification: true
