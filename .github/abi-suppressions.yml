# ABI check suppression rules for the SVS C++ runtime bindings.
#
# Measured on libsvs_runtime.so as this repo's CI builds it: of 138 exported
# symbols, 35 are leaked libstdc++ template instantiations, which is what the rules
# below cover. Another 31 are std::once_flag guard thunks for local statics inside
# svs::index::ivf instantiations; they mangle as _ZZ..., so `^_ZNSt` deliberately
# does not reach them -- they are svs code despite the std:: in the name.
#
# The leak is not a missing -fvisibility=hidden (that is set in
# bindings/cpp/CMakeLists.txt); it tracks the build path. Linking the prebuilt LTO
# archive exports 138 symbols, compiling svs in-tree exports 276, with the same
# compiler either way. No pattern here can close that gap; a linker version script
# defining the intended surface would.

version: 1
suppressions:
  # --- C++ standard library / runtime (never part of the SVS API) ---
  - symbol_pattern: "^_ZNSt.*"
    reason: "C++ standard library symbols (leaked template instantiations)"
    label: "stdlib"

  - symbol_pattern: "^_ZSt.*"
    reason: "C++ standard library functions"
    label: "stdlib"

  # RTTI/vtable/VTT for std types mangle as _ZTI/_ZTS/_ZTV/_ZTT, not _ZNSt.
  - symbol_pattern: "^_ZT[VIST]N?St.*"
    reason: "RTTI/vtable/VTT for std:: types (e.g. thread::_State_impl, future)"
    label: "stdlib"

  # 2 of these are exported (verified with nm), so this rule is load-bearing even
  # on runs where it matches nothing.
  - symbol_pattern: "^_ZT[VIST].*__gnu_cxx.*"
    reason: "RTTI/vtable for __gnu_cxx types, leaked"
    label: "stdlib"

  # No rules for third-party (fmt/spdlog/tsl/toml++) or __cxa_*: the vendored deps
  # ship as static archives that -Wl,--exclude-libs,ALL keeps out, and __cxa_* are
  # imports, never defined here. libstdc++ is a shared library, hence the std:: rules.
  #
  # abicheck lists rules that matched nothing under "Stale rules", which means "no
  # change touched it this run", not "delete it".

  # --- Waivers ---
  # None. To waive a real finding, add a finding_id rule (id copied from the report)
  # with a reason and an `expires`. finding_id matches one finding kind on one symbol
  # but does not pin the old->new values, so a later unrelated change to the same
  # symbol would be waived silently too -- hence the expiry.

  # --- svs::runtime::v0 and svs::...detail...: deliberately NOT suppressed ---
  # The 55 declared v0 functions are the whole point of the check. `detail` symbols
  # are not suppressed either: users reach them transitively through template
  # instantiation, so a vtable or layout change there is a real break.
