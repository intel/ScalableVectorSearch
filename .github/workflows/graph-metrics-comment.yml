name: Graph Metrics PR Comment

on:
  workflow_run:
    workflows: ['Synthetic Graph Metrics']
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      # The write-capable job runs only default-branch code. PR artifacts are
      # parsed as JSON; no PR scripts or binaries execute in this job.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download dependency decision and metrics
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: graph-metrics-results-*
          path: ${{ runner.temp }}/graph-metrics-artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Update the PR metrics or skipped message
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 .github/graph-metrics/ci.py comment \
            --artifacts "${RUNNER_TEMP}/graph-metrics-artifacts"
