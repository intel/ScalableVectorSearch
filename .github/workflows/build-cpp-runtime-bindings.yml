name: Build and test C++ Runtime Bindings

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  build-cpp-runtime-bindings:
    name: Build and unit tests for C++ runtime bindings
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - name: "with static library"
            enable_lvq_leanvec: "ON"
            require_lto: "ON"
            suffix: ""
          - name: "public only"
            enable_lvq_leanvec: "OFF"
            require_lto: "OFF"
            suffix: "-public-only"
      fail-fast: false

    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build -t svs-manylinux228:latest -f docker/x86_64/manylinux228/Dockerfile .

      - name: Build libraries in Docker container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e ENABLE_LVQ_LEANVEC=${{ matrix.enable_lvq_leanvec }} \
            -e REQUIRE_LTO_ARCHIVE=${{ matrix.require_lto }} \
            -e SUFFIX=${{ matrix.suffix }} \
            svs-manylinux228:latest \
            /bin/bash .github/scripts/build-cpp-runtime-bindings.sh

      - name: Upload cpp runtime bindings artifacts
        uses: actions/upload-artifact@v7
        with:
          name: svs-cpp-runtime-bindings${{ matrix.suffix }}
          path: svs-cpp-runtime-bindings${{ matrix.suffix }}.tar.gz
          # Extend main retention for ABI comparison; keep PR builds short-lived.
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 7 }}

      - name: Upload conda package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: libsvs-runtime-conda${{ matrix.suffix }}
          path: conda-bld/linux-64/libsvs-runtime-*.conda
          retention-days: 7

      # Run unit tests that were built as part of this job
      - name: Run unit tests in Docker container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e ENABLE_LVQ_LEANVEC=${{ matrix.enable_lvq_leanvec }} \
            svs-manylinux228:latest \
            /bin/bash /workspace/.github/scripts/test-cpp-runtime-unit.sh

  # Run full test script using the built artifacts
  test:
    name: Integration tests for C++ runtime
    needs: build-cpp-runtime-bindings
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        # enable_lvq_leanvec must match the build job's value for this suffix; if they
        # disagree, test-faiss.sh expects the wrong outcome from the downloaded artifact.
        include:
          - name: "with static library"
            enable_lvq_leanvec: "ON"
            suffix: ""
          - name: "public only"
            enable_lvq_leanvec: "OFF"
            suffix: "-public-only"
      fail-fast: false

    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build -t svs-manylinux228:latest -f docker/x86_64/manylinux228/Dockerfile .

      # Need to download for a new job
      - name: Download conda package
        uses: actions/download-artifact@v8
        with:
          name: libsvs-runtime-conda${{ matrix.suffix }}
          path: runtime_conda

      - name: List available artifacts
        run: |
          ls -la runtime_conda/

      - name: Test in Docker container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -v ${{ github.workspace }}/runtime_conda:/runtime_conda \
            -w /workspace \
            -e ENABLE_LVQ_LEANVEC=${{ matrix.enable_lvq_leanvec }} \
            svs-manylinux228:latest \
            /bin/bash .github/scripts/test-faiss.sh

  abi-check:
    name: ABI check against main
    needs: build-cpp-runtime-bindings
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read  # list runs and download artifacts, to fetch main's as baseline
      pull-requests: write  # sticky ABI report comment; not granted on fork PRs, where it no-ops
    # The label downgrades this job to informational rather than skipping it, so an
    # intentional break is still reported rather than going unmeasured.
    continue-on-error: ${{ contains(toJson(github.event.pull_request.labels.*.name), '"API/ABI breaking change"') }}

    steps:
      - uses: actions/checkout@v6

      # Baseline is main's tip, not the PR's merge-base: a PR far behind main also
      # sees main's own changes, which is noisy but never a false "compatible".
      - name: Download baseline build from main
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p baseline
          # Not filtered on conclusion: a run whose tests failed still produced a
          # valid tarball, and a run that produced none just fails to download and
          # falls through to the next candidate.
          #
          # REST rather than `gh run list`, which was observed returning stale pages
          # that omitted the newest run and burned every candidate on expired ones.
          candidates=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/build-cpp-runtime-bindings.yml/runs?branch=main&event=push&per_page=20" \
            --jq '.workflow_runs[] | "\(.id) \(.head_sha)"')

          label=
          while read -r run_id sha; do
            [ -n "$run_id" ] || continue
            [ "$run_id" != "$GITHUB_RUN_ID" ] || continue
            if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
                 --name svs-cpp-runtime-bindings --dir baseline; then
              label="main@${sha:0:12}"
              echo "Baseline: run $run_id ($label)"
              break
            fi
          done <<< "$candidates"

          if [ -z "$label" ]; then
            echo "::error::No recent main run has a downloadable" \
                 "svs-cpp-runtime-bindings artifact. Re-run this workflow on main" \
                 "to refresh the baseline."
            exit 1
          fi
          echo "label=$label" >> "$GITHUB_OUTPUT"

      # Default variant only; -public-only builds from the same headers.
      - name: Download this build
        uses: actions/download-artifact@v8
        with:
          name: svs-cpp-runtime-bindings
          path: current

      - name: Stage artifacts for comparison
        id: stage
        env:
          LIBRARY: libsvs_runtime.so
          HEADER_SUBDIR: include/svs/runtime
        run: |
          .github/scripts/abi-stage.sh \
            baseline/svs-cpp-runtime-bindings.tar.gz \
            current/svs-cpp-runtime-bindings.tar.gz

      - name: Compare
        id: compare
        uses: abicheck/abicheck@v0.6.0
        with:
          # The only conda-forge source that ships clang, which .abicheck.yml's
          # compile.frontend needs; the default source provides castxml and gcc only.
          dependency-source: conda-forge-clang20
          build-config: .abicheck.yml
          old-library: ${{ steps.stage.outputs.old-library }}
          new-library: ${{ steps.stage.outputs.new-library }}
          old-header: ${{ steps.stage.outputs.old-header }}
          new-header: ${{ steps.stage.outputs.new-header }}
          old-include: ${{ steps.stage.outputs.old-include }}
          new-include: ${{ steps.stage.outputs.new-include }}
          old-version: ${{ steps.baseline.outputs.label }}
          new-version: ${{ github.event.pull_request.number && format('PR {0}', github.event.pull_request.number) || github.ref_name }}
          extra-args: ${{ steps.stage.outputs.extra-args }}
          suppress: .github/abi-suppressions.yml
          policy: strict_abi
          # A source-level break is a break for us too; the action only gates on binary.
          fail-on-api-break: true
          annotate: true
          annotate-additions: true  # the added-API table is the point, not just the breaks

      # Exit 1/16/64 means the comparison never happened. The step is already red;
      # this only stops a harness bug from being read in the log as an ABI break.
      - name: Report a failed comparison as plumbing
        if: failure() && steps.compare.outputs.exit-code != ''
        run: |
          case '${{ steps.compare.outputs.exit-code }}' in
            2 | 4 | 5) ;;
            *) echo "::error::ABI check could not run (rc=${{ steps.compare.outputs.exit-code }})." ;;
          esac
