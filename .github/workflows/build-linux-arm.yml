name: Linux Build and Test on ARM

# Builds only in the merge queue; on pull requests every job is skipped so the required check is satisfied.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: ${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.cxx }}, ${{ matrix.build_type }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04-arm
    strategy:
      matrix:
        build_type: [RelWithDebInfo]
        cxx: [g++-11, g++-12, clang++-15]
        include:
        - cxx: g++-11
          cc: gcc-11
        - cxx: g++-12
          cc: gcc-12
        - cxx: clang++-15
          cc: clang-15

    steps:
    - uses: actions/checkout@v6

    - name: Configure build
      working-directory: ${{ runner.temp }}
      env:
        CXX: ${{ matrix.cxx }}
        CC: ${{ matrix.cc }}
        TEMP_WORKSPACE: ${{ runner.temp }}
      run: |
        cmake -B${TEMP_WORKSPACE}/build -S${GITHUB_WORKSPACE} \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DSVS_BUILD_BINARIES=YES \
              -DSVS_BUILD_TESTS=YES \
              -DSVS_BUILD_EXAMPLES=YES \
              -DSVS_EXPERIMENTAL_LEANVEC=YES

    - name: Build Tests and Utilities
      working-directory: ${{ runner.temp }}/build
      run: make -j$(nproc)

    - name: Run tests
      env:
        CTEST_OUTPUT_ON_FAILURE: 1
      working-directory: ${{ runner.temp }}/build/tests
      run: ctest -C ${{ matrix.build_type }}

  linux-arm-passed:
    # Skipped (shown grey) when nothing ran, so the PR page doesn't show a green check for unbuilt work.
    name: linux-arm-passed
    if: always() && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-22.04
    steps:
    - name: Require the build to have run and succeeded
      run: |
        echo "build=${{ needs.build.result }}"
        [[ "${{ needs.build.result }}" == success ]]
