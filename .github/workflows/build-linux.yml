name: Linux Build and Test

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: ${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Skip the builds on pull requests that only touch paths this workflow ignores.
  changes:
    name: Detect changes
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true' }}
    steps:
    - id: filter
      if: github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')
        # relevant if any changed file is outside the ignored paths
        if grep -qvE '^bindings/|\.md$' <<< "$files"; then echo relevant=true; else echo relevant=false; fi >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.toolchain.cxx }}, ${{ matrix.build_type }}, ivf=${{ matrix.ivf }}, asan=${{ matrix.asan }}
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        build_type: [RelWithDebInfo]
        ivf: [OFF, ON]
        # cc rides with cxx in one object so the pull request exclusions below can't strand an include.
        toolchain:
        - {cxx: g++-11, cc: gcc-11}
        - {cxx: g++-12, cc: gcc-12}
        - {cxx: clang++-15, cc: clang-15}
        asan: [OFF]
        cmake_extra_args: [-DSVS_BUILD_BINARIES=YES -DSVS_BUILD_EXAMPLES=YES]
        ctest_args: ['']
        include:
        - toolchain: {cxx: clang++-18, cc: clang-18}
          build_type: Debug
          ivf: OFF
          asan: ON
            # address sanitizer flags
          cmake_extra_args: >-
            -DCMAKE_CXX_FLAGS='-fsanitize=address -fno-omit-frame-pointer -g'
            -DCMAKE_C_FLAGS='-fsanitize=address -fno-omit-frame-pointer -g'
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address'
            -DCMAKE_SHARED_LINKER_FLAGS='-fsanitize=address'
            -DSVS_BUILD_BINARIES=NO
            -DSVS_BUILD_EXAMPLES=NO
           # skip longer-running tests
          ctest_args: -LE long
        # Pull requests run g++-11 ivf=ON and ASan; the merge queue runs the full matrix.
        exclude: ${{ fromJSON(github.event_name == 'pull_request' && '[{"toolchain":{"cxx":"g++-12","cc":"gcc-12"}},{"toolchain":{"cxx":"clang++-15","cc":"clang-15"}},{"toolchain":{"cxx":"g++-11","cc":"gcc-11"},"ivf":"OFF"}]' || '[{"toolchain":{"cxx":"g++-12","cc":"gcc-12"},"ivf":"ON"}]') }}

    steps:
    - uses: actions/checkout@v6
    - name: Install MKL
      timeout-minutes: 5
      run: |
        .github/scripts/setup_apt_repo_linux.sh
        sudo apt install intel-oneapi-mkl intel-oneapi-mkl-devel
        # Setup environment variables for building against MKL.
        # Persist the environment variables for use across multiple subsequent actions.
        source /opt/intel/oneapi/setvars.sh
        printenv >> $GITHUB_ENV

    - name: Install Clang 18
      if: matrix.toolchain.cxx == 'clang++-18'
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 18

    - name: Configure build
      working-directory: ${{ runner.temp }}
      env:
        CXX: ${{ matrix.toolchain.cxx }}
        CC: ${{ matrix.toolchain.cc }}
        TEMP_WORKSPACE: ${{ runner.temp }}
      run: |
        cmake -B${TEMP_WORKSPACE}/build -S${GITHUB_WORKSPACE} \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DSVS_BUILD_TESTS=YES \
              -DSVS_NO_AVX512=NO \
              -DSVS_EXPERIMENTAL_ENABLE_IVF=${{ matrix.ivf }} \
              ${{ matrix.cmake_extra_args }}

    - name: Build Tests and Utilities
      working-directory: ${{ runner.temp }}/build
      run: make -j$(nproc)

    - name: Run tests
      env:
        CTEST_OUTPUT_ON_FAILURE: 1
      working-directory: ${{ runner.temp }}/build/tests
      run: ctest -C ${{ matrix.build_type }} ${{ matrix.ctest_args }}

    - name: Run Cpp Examples
      if: matrix.asan != 'ON'
      env:
        CTEST_OUTPUT_ON_FAILURE: 1
      working-directory: ${{ runner.temp }}/build/examples/cpp
      run: ctest -C ${{ matrix.build_type }}

  # Fixed-name required check; matrix job names can't be required because they change with the matrix.
  linux-passed:
    # Skipped (shown grey) when nothing ran; still runs if change detection itself failed.
    name: linux-passed
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.relevant == 'true')
    needs: [changes, build]
    runs-on: ubuntu-22.04
    steps:
    - name: Require every job to have run and succeeded
      run: |
        echo "changes=${{ needs.changes.result }} build=${{ needs.build.result }}"
        [[ "${{ needs.changes.result }}" == success && "${{ needs.build.result }}" == success ]]
