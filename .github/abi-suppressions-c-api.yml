# ABI check suppression rules for libsvs_c_api.so.
#
# Intentionally empty, and expected to stay that way: the C API is compiled with
# -fvisibility=hidden and exports only `svs_*`, so there are no mangled names, no
# template instantiations from header-only dependencies, and no std:: internals to
# waive -- unlike the C++ libraries, whose exported set leaks all three.
#
# The file exists rather than being omitted so the --suppress path the workflows
# pass is a real one. abi-check.sh skips a missing file silently, which would make
# a typo in that path indistinguishable from this deliberate emptiness.

version: 1
suppressions: []
